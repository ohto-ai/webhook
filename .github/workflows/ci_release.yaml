name: Cross-platform CI & Release

on:
  push:
    paths:
      - '.github/workflows/ci_release.yaml'
      - 'src/**'
      - 'inc/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - 'Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/ci_release.yaml'
      - 'src/**'
      - 'inc/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/**'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            cmake_opts: ""
          - os: ubuntu-22.04
            cmake_opts: ""
          - os: ubuntu-24.04
            cmake_opts: "-DENABLE_SANITIZERS=ON"
          - os: windows-2019
            cmake_opts: ""
          - os: windows-2022
            cmake_opts: ""
          - os: macos-12
            cmake_opts: ""
          - os: macos-14
            cmake_opts: ""

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Build
      id: build
      shell: bash
      run: |
        cmake -B build ${{ matrix.cmake_opts }}
        source scripts/env.sh
        cmake --build build --config Release --target $bin_name -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

        if [[ $os_name == "Linux" ]]; then
          package_path=$deb_path
          asset_name="${{ matrix.os }}_${deb_file}"
          cmake --build build --config Release --target package -j$(nproc)
        else
          package_path=$bin_path
          asset_name="${{ matrix.os }}_${bin_name}-${bin_version}${bin_suffix}"
        fi

        echo "package_name=$bin_name" >> $GITHUB_OUTPUT
        echo "package_path=$package_path" >> $GITHUB_OUTPUT
        echo "commit_hash=$commit_hash" >> $GITHUB_OUTPUT
        echo "asset_name=$asset_name" >> $GITHUB_OUTPUT

    - name: Test
      if: matrix.cmake_opts != '-DENABLE_SANITIZERS=ON'
      run: |
        cmake --build build --config Release -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        cd build
        ctest -C Release --output-on-failure

    - name: Test with sanitizers
      if: matrix.cmake_opts == '-DENABLE_SANITIZERS=ON'
      run: |
        cmake --build build --config Release -j$(nproc)
        cd build
        UBSAN_OPTIONS=print_stacktrace=1 ASAN_OPTIONS=detect_leaks=1 ctest -C Release --output-on-failure

    - name: Upload Artifacts
      if: github.ref_name == 'master' || github.ref_type == 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.package_name }}-${{ matrix.os }}
        path: ${{ steps.build.outputs.package_path }}

    - name: Upload Release
      if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ steps.build.outputs.package_path }}
        asset_name: ${{ steps.build.outputs.asset_name }}
        tag: ${{ github.ref_name }}
        overwrite: true

  docker:
    name: Docker build
    runs-on: ubuntu-22.04
    if: github.ref_name == 'master' || github.ref_type == 'tag'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t ohtoai-webhook:latest .

    - name: Test Docker image
      run: |
        docker run --rm ohtoai-webhook:latest --help || true
